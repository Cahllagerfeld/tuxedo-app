[package]
name = "tuxedo-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only: lets dependent crates' tests inject a directory-sync failure after a rename.
fault-injection = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
